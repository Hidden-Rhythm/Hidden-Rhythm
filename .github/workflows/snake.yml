name: 🐍 Update contribution snake

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout the repository so the action can commit to it
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Generate the snake SVG
      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: Hidden-Rhythm
          outputs: |
            assets/github-contribution-grid-snake.svg?palette=github-dark

      # 3. Commit and push the generated file back to the repo
      - name: Commit and Push
        uses: EndBug/add-and-commit@v9
        with:
          message: "chore: update contribution snake"
          default_author: github_actions
